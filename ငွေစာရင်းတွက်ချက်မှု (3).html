<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ငွေစာရင်းတွက်ချက်မှု</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f1;--card:#ffffff;--ink:#17262b;--muted:#5d7176;--line:#d5dfdd;
  --accent:#0f6b5c;--accent-ink:#ffffff;--soft:#e2f1ee;--plus:#b4531a;--minus:#0f6b5c;
  --field:#f7faf9;--shadow:0 1px 2px rgba(23,38,43,.08);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101a1c;--card:#182427;--ink:#e6f0ee;--muted:#9bb0b3;--line:#2a3b3f;
    --accent:#3fc1a8;--accent-ink:#06211b;--soft:#1d3a38;--plus:#f09a62;--minus:#3fc1a8;
    --field:#121d20;--shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101a1c;--card:#182427;--ink:#e6f0ee;--muted:#9bb0b3;--line:#2a3b3f;
  --accent:#3fc1a8;--accent-ink:#06211b;--soft:#1d3a38;--plus:#f09a62;--minus:#3fc1a8;
  --field:#121d20;--shadow:none;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans Myanmar","Padauk","Myanmar Text",system-ui,sans-serif;
  line-height:1.9;font-size:16px;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:1.3rem;margin:0;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:4px 10px;margin:6px 0 14px}
.brand{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:1rem;letter-spacing:.4px;--g1:#8a5d00;--g2:#c99a1a;color:var(--g1)}
.brand svg{width:20px;height:20px;flex:none;fill:var(--g2)}
.brand b{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .brand{--g1:#ffe27a;--g2:#f0b429}}
:root[data-theme="dark"] .brand{--g1:#ffe27a;--g2:#f0b429}
.share{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.share a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none}
.share .btn{margin:0;min-height:48px;font-size:.9rem;padding:0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:1rem;margin:0 0 8px;font-weight:700;color:var(--accent)}
label{display:block;font-size:.9rem;color:var(--muted);margin:6px 0 2px}
input[type=text],input[type=date],select{width:100%;min-height:48px;padding:8px 12px;font:inherit;font-size:1rem;color:var(--ink);
  background:var(--field);border:1px solid var(--line);border-radius:10px}
input:focus,select:focus,button:focus-visible,.radio:focus-within{outline:3px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.radios{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 4px}
.radio{display:flex;align-items:center;justify-content:center;gap:4px;min-height:48px;font-size:.95rem;border:1px solid var(--line);
  border-radius:10px;background:var(--field);cursor:pointer;margin:0;color:var(--ink)}
.radio input{accent-color:var(--accent);width:20px;height:20px;margin:0}
.radio:has(input:checked){border-color:var(--accent);background:var(--soft);font-weight:700}
.res{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px dashed var(--line)}
.res:first-of-type{margin-top:8px}
.res .k{color:var(--muted);font-size:.92rem}
.res .v{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.res .r{display:flex;align-items:center;gap:8px}
.mini{min-height:40px;min-width:64px;padding:0 12px;font:inherit;font-size:.85rem;border-radius:8px;border:1px solid var(--accent);
  background:transparent;color:var(--accent);cursor:pointer}
.mini:active{background:var(--soft)}
.radios.two{grid-template-columns:repeat(2,1fr)}
.mul{display:grid;grid-template-columns:1fr auto;gap:8px}
.mul select{width:auto;min-width:108px}
.hint{text-align:right;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
.hint span{font-weight:700;color:var(--ink)}
input[readonly]{background:var(--soft);font-weight:700}
.final{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:12px;border-radius:10px;background:var(--soft)}
.final .v{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.v.plus{color:var(--plus)}.v.minus{color:var(--minus)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit;font-size:.95rem;line-height:1.9;
  background:var(--field);border:1px solid var(--line);border-radius:10px;padding:12px}
.btn{width:100%;min-height:52px;font:inherit;font-size:1rem;font-weight:700;border-radius:12px;border:0;cursor:pointer;margin-top:10px}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.sub{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn:active{transform:scale(.99)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.95rem;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:20;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.bar div{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.bar .t{flex:1;min-width:0;font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem}
.bar .btn{margin:0;width:auto;padding:0 18px}
@media (prefers-reduced-motion:reduce){#toast,.btn{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>ငွေစာရင်းတွက်ချက်မှု</h1><span class="brand" role="img" aria-label="ShweKhinMyay"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8 7-8 13L4 9z"/></svg><b>ShweKhinMyay</b></span></div>

  <section class="card">
    <h2>ခေါင်းစဉ်နှင့် အကြိမ်</h2>
    <label for="pdate">ရက်စွဲ (Calendar မှ ရွေးရန်)</label>
    <input type="date" id="pdate">
    <div class="radios two">
      <label class="radio"><input type="radio" name="ampm" value="AM"> AM</label>
      <label class="radio"><input type="radio" name="ampm" value="PM"> PM</label>
    </div>
    <label for="round">အကြိမ် ရွေးရန်</label>
    <select id="round"></select>
    <label for="pname">အမည်</label>
    <input type="text" id="pname" placeholder="အမည် ရိုက်ထည့်ပါ" autocomplete="off">
  </section>

  <section class="card">
    <h2>ရောင်းငွေ နှင့် ကော်၊ အပ်ငွေ</h2>
    <label for="sales">ရောင်းငွေ (ကျပ်)</label>
    <input type="text" id="sales" class="num" inputmode="numeric" placeholder="0" autocomplete="off">
    <label>ကော် ရာခိုင်နှုန်း</label>
    <div class="radios">
      <label class="radio"><input type="radio" name="rate" value="15"> ၁၅%</label>
      <label class="radio"><input type="radio" name="rate" value="17"> ၁၇%</label>
      <label class="radio"><input type="radio" name="rate" value="25" checked> ၂၅%</label>
      <label class="radio"><input type="radio" name="rate" value="30"> ၃၀%</label>
    </div>
    <div class="res"><span class="k">ကော်</span>
      <span class="r"><span class="v" id="rComm">0</span><button class="mini" data-copy="rComm">Copy</button></span></div>
    <div class="res"><span class="k">အပ်ငွေ</span>
      <span class="r"><span class="v" id="rNet">0</span><button class="mini" data-copy="rNet">Copy</button></span></div>
  </section>

  <section class="card">
    <h2>ပေါင်းထည့်ငွေများ</h2>
    <label for="debt">အကြွေးကျန် (ကျပ်)</label>
    <input type="text" id="debt" class="num" inputmode="numeric" placeholder="0" autocomplete="off">
    <label for="lump">အလုံးပါ (ကျပ်)</label>
    <input type="text" id="lump" class="num" inputmode="numeric" placeholder="0" autocomplete="off">
    <div class="res"><span class="k">စုစုပေါင်း အပ်ငွေ</span>
      <span class="r"><span class="v" id="rAll">0</span><button class="mini" data-copy="rAll">Copy</button></span></div>
  </section>

  <section class="card">
    <h2>အလျော်</h2>
    <label for="dae">ဒဲ့ (ကျပ်) × ဆ ရွေးရန်</label>
    <div class="mul"><input type="text" id="dae" class="num" inputmode="numeric" placeholder="0" autocomplete="off"><select id="daeMul" aria-label="ဒဲ့ ဆ"><option value="550">× 550 ဆ</option><option value="600">× 600 ဆ</option><option value="80">× 80 ဆ</option><option value="75">× 75 ဆ</option></select></div>
    <div class="hint">ဒဲ့ = <span id="dRes">0</span></div>
    <label for="thwad">သွဒ် (ကျပ်) × 10</label>
    <input type="text" id="thwad" class="num" inputmode="numeric" placeholder="0" autocomplete="off">
    <div class="hint">သွဒ် = <span id="sRes">0</span></div>
    <label for="apa">အပါ (ကျပ်) × ရွေးရန်</label>
    <div class="mul"><input type="text" id="apa" class="num" inputmode="numeric" placeholder="0" autocomplete="off"><select id="apaMul" aria-label="အပါ"><option value="3">× 3</option><option value="8">× 8</option><option value="15">× 15</option></select></div>
    <div class="hint">အပါ = <span id="aRes">0</span></div>
    <label for="payable">အလျော် စုစုပေါင်း (ဒဲ့ + သွဒ် + အပါ)</label>
    <input type="text" id="payable" class="num" readonly placeholder="0">
    <div class="final"><span class="k">စုစုပေါင်း</span>
      <span class="r"><span class="v" id="rFinal">0</span></span></div>
  </section>

  <section class="card">
    <h2>စာရင်း အကျဉ်းချုပ်</h2>
    <pre id="summary"></pre>
    <button class="btn main" id="copyAll">📋 စာရင်းအားလုံး Copy ယူမည် (Copy All)</button>
    <div class="share">
      <a class="btn sub" id="shSms" data-fb="1" href="sms:" target="_blank" rel="noopener">💬 SMS</a>
      <a class="btn sub" id="shViber" data-fb="1" href="viber://forward" target="_blank" rel="noopener">📞 Viber</a>
      <button class="btn sub" data-share="messenger">✉️ Messenger</button>
      <button class="btn sub" id="shareSys">📤 Share...</button>
    </div>
    <button class="btn sub" id="reset">🔄 အသစ်ပြန်တွက်မည် (Reset)</button>
  </section>
</div>
<div class="bar"><div><span class="t" id="barTotal">စုစုပေါင်း= 0</span><button class="btn main" id="barCopy">📋 Copy All</button></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var MM="၀၁၂၃၄၅၆၇၈၉";
  function toMM(n){return String(n).replace(/\d/g,function(d){return MM[d]})}

  var round=$("round");
  for(var i=1;i<=24;i++){var o=document.createElement("option");o.value=i;o.textContent=toMM(i)+" ကြိမ်";round.appendChild(o)}
  var o2=document.createElement("option");o2.value="2D";o2.textContent="2D";round.appendChild(o2);

  var moneyIds=["sales","debt","lump","dae","thwad","apa"];
  function parse(el){return parseInt(el.value.replace(/[^\d]/g,""),10)||0}
  function fmt(n){
    var r=Math.round(n*100)/100;
    return r.toLocaleString("en-US",{maximumFractionDigits:2});
  }
  function formatInput(el){
    var start=el.selectionStart,before=el.value.length;
    var digits=el.value.replace(/[^\d]/g,"").replace(/^0+(?=\d)/,"");
    el.value=digits?Number(digits).toLocaleString("en-US"):"";
    var pos=start+(el.value.length-before);
    try{el.setSelectionRange(pos,pos)}catch(e){}
  }

  var last="";
  function calc(){
    var sales=parse($("sales")),debt=parse($("debt")),lump=parse($("lump")),vd=parse($("dae"))*Number($("daeMul").value),vs=parse($("thwad"))*10,va=parse($("apa"))*Number($("apaMul").value),pay=vd+vs+va;
    $("dRes").textContent=fmt(vd);$("sRes").textContent=fmt(vs);$("aRes").textContent=fmt(va);
    $("payable").value=pay?fmt(pay):"";
    var dv=$("pdate").value,ap=document.querySelector('input[name=ampm]:checked');
    var ds=dv?dv.slice(8,10)+"."+dv.slice(5,7)+"."+dv.slice(2,4):"";
    ds=(ds+(ap?" "+ap.value:"")).trim();
    var pct=document.querySelector('input[name=rate]:checked').value;
    var comm=sales*(Number(pct)/100);
    var net=sales-comm;
    var all=net+debt+lump;
    var diff=Math.abs(all-pay);
    var sign=all>pay?"-":(all<pay?"+":"");

    $("rComm").textContent=fmt(comm);
    $("rNet").textContent=fmt(net);
    $("rAll").textContent=fmt(all);
    var fin=$("rFinal");
    fin.textContent=(sign?sign+" ":"")+(sign?fmt(diff):"0");
    fin.className="v "+(sign==="+"?"plus":sign==="-"?"minus":"");
    $("barTotal").textContent="စုစုပေါင်း= "+fin.textContent;

    last=(round.value==="2D"?"2D":round.value+" ကြိမ်")+"\n\n"+
      "ရက်စွဲ= "+ds+"\n"+"အမည်= "+$("pname").value.trim()+"\n"+"ရောင်း: "+fmt(sales)+" ကျပ်\n"+
      "ကော် ("+pct+"%):  "+fmt(comm)+" ကျပ်\n"+
      "အပ်ငွေ= "+fmt(net)+" ကျပ်\n"+
      "ကျန် -= "+fmt(debt)+" ကျပ်\n"+
      "အလုံး (-): "+fmt(lump)+" ကျပ်\n"+
      "စုစု -= "+fmt(all)+" ကျပ်\n"+
      "အလျော်= "+fmt(pay)+" ကျပ်\n"+
      "စုစုပေါင်း= "+(sign?sign+" "+fmt(diff):"0")+" ကျပ်";
    var hide=[];
    if(!$("pname").value.trim())hide.push("အမည်=");
    if(!ds)hide.push("ရက်စွဲ=");
    if(!sales)hide.push("ရောင်း:","ကော် (","အပ်ငွေ=");
    if(!debt)hide.push("ကျန် -=");
    if(!lump)hide.push("အလုံး (-)");
    if(!debt&&!lump)hide.push("စုစု -=");
    if(!pay)hide.push("အလျော်=","စုစုပေါင်း=");
    last=last.split("\n").filter(function(l){return !hide.some(function(h){return l.indexOf(h)===0})}).join("\n").replace(/\n+$/,"");
    $("summary").textContent=last;
    var enc=encodeURIComponent(last);
    $("shSms").href="sms:?&body="+enc;
    $("shViber").href="viber://forward?text="+enc;
  }

  var tt;
  function toast(msg){
    var t=$("toast");t.textContent=msg;t.classList.add("show");
    clearTimeout(tt);tt=setTimeout(function(){t.classList.remove("show")},1800);
  }
  function copy(text,msg){
    function ok(){toast(msg)}
    function fallback(){
      var ta=document.createElement("textarea");ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy");ok()}catch(e){toast("Copy မရပါ၊ ထပ်ကြိုးစားပါ")}
      document.body.removeChild(ta);
    }
    if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(ok,fallback)}else fallback();
  }

  moneyIds.forEach(function(id){
    $(id).addEventListener("input",function(){formatInput(this);calc()});
  });
  $("pname").addEventListener("input",calc);
  $("pdate").addEventListener("input",calc);
  $("pdate").addEventListener("change",calc);
  round.addEventListener("change",calc);
  $("daeMul").addEventListener("change",calc);
  $("apaMul").addEventListener("change",calc);
  document.querySelectorAll('input[name=rate],input[name=ampm]').forEach(function(r){r.addEventListener("change",calc)});

  document.querySelectorAll("[data-copy]").forEach(function(b){
    b.addEventListener("click",function(){
      copy($(b.getAttribute("data-copy")).textContent.replace(/,/g,""),"Copy ယူပြီးပါပြီ ✓");
    });
  });
  function copyAll(){calc();copy(last,"စာရင်းအားလုံး Copy ယူပြီးပါပြီ ✓")}
  function openUrl(u){var w=null;try{w=window.open(u,"_blank")}catch(e){}if(!w){try{window.location.href=u}catch(e){}}}
  function share(app){
    calc();
    var t=encodeURIComponent(last);
    if(app==="sms"){openUrl("sms:?&body="+t)}
    else if(app==="viber"){openUrl("viber://forward?text="+t)}
    else{copy(last,"Copy ယူပြီး Messenger ထဲ Paste လုပ်ပါ ✓");setTimeout(function(){openUrl("fb-messenger://")},800)}
  }
  document.querySelectorAll("[data-share]").forEach(function(b){b.addEventListener("click",function(){share(b.getAttribute("data-share"))})});
  $("copyAll").addEventListener("click",copyAll);
  document.querySelectorAll("[data-fb]").forEach(function(a){a.addEventListener("click",function(){calc();copy(last,"Copy လည်း ယူပြီး — app မပွင့်ရင် Paste လုပ်ပါ ✓")})});
  $("shareSys").addEventListener("click",function(){calc();if(navigator.share){navigator.share({text:last}).catch(function(){})}else{copy(last,"Copy ယူပြီးပါပြီ၊ app ထဲ Paste လုပ်ပါ ✓")}});
  $("barCopy").addEventListener("click",copyAll);
  $("reset").addEventListener("click",function(){
    $("pname").value="";$("pdate").value="";document.querySelectorAll('input[name=ampm]').forEach(function(r){r.checked=false});round.value="1";$("daeMul").selectedIndex=0;$("apaMul").selectedIndex=0;
    moneyIds.forEach(function(id){$(id).value=""});
    document.querySelector('input[name=rate][value="25"]').checked=true;
    calc();toast("အသစ်ပြန်စပြီးပါပြီ");
  });

  calc();
})();
</script>
</body>
</html>
